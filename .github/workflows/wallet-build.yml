name: Build and release IEUM Wallet

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: 0.0.9.3
        type: string

permissions:
  contents: write

env:
  DISPLAY_VERSION: 0.0.9.3
  INTERNAL_VERSION: 0.0.9-3

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate requested and source versions
        shell: bash
        run: |
          test "${{ inputs.version }}" = "$DISPLAY_VERSION"
          test "$(node -p "require('./package.json').version")" = "$INTERNAL_VERSION"
          test "$(node -p "require('./src-tauri/tauri.conf.json').version")" = "$INTERNAL_VERSION"
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -1)" = "$INTERNAL_VERSION"
          test -n "${{ vars.TAURI_UPDATER_PUBLIC_KEY }}"
          test -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
      - run: npm ci
      - run: npm run build
      - run: npm test

  desktop:
    name: Release ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            os: windows-latest
            args: --bundles nsis,msi
          - name: Ubuntu x86_64
            os: ubuntu-22.04
            args: --bundles appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Ubuntu dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 xdg-utils
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Refresh Rust lockfile for updater dependency
        run: cargo generate-lockfile
      - name: Inject updater verification key
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/configure-updater.mjs
      - name: Build, sign and publish desktop update
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: wallet-v0.0.9.3
          releaseName: IEUM Wallet v0.0.9.3
          releaseBody: IEUM Wallet v0.0.9.3 - signed automatic updater bootstrap release.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: IEUM-Wallet-v0.0.9.3-[platform]-[arch]-[bundle]
          releaseAssetNamePattern: IEUM-Wallet-v0.0.9.3-[platform]-[arch]-[bundle][setup].[ext]
          args: ${{ matrix.args }}

  android:
    name: Build Android ARM64
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        shell: bash
        run: sdkmanager "ndk;28.2.13676358"
      - run: npm ci
      - name: Initialize Android project
        shell: bash
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            npm run tauri -- android init --ci
          fi
      - name: Build Android ARM64 debug APK
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
        run: npm run tauri -- android build --ci --debug --apk --target aarch64
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: IEUM-Wallet-v0.0.9.3-android-arm64
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
