name: Build IEUM Wallet

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: 0.0.9.1
        type: string

permissions:
  contents: read

env:
  DISPLAY_VERSION: 0.0.9.1
  INTERNAL_VERSION: 0.0.9-1

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate requested and source versions
        shell: bash
        run: |
          test "${{ inputs.version }}" = "$DISPLAY_VERSION"
          test "$(node -p "require('./package.json').version")" = "$INTERNAL_VERSION"
          test "$(node -p "require('./src-tauri/tauri.conf.json').version")" = "$INTERNAL_VERSION"
      - run: npm ci
      - run: npm run build
      - run: npm test

  desktop:
    name: Build ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            os: windows-latest
            bundles: nsis,msi
            artifact: IEUM-Wallet-v0.0.9.1-windows-x86_64
          - name: Ubuntu x86_64
            os: ubuntu-22.04
            bundles: appimage,deb
            artifact: IEUM-Wallet-v0.0.9.1-ubuntu-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Ubuntu dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Build desktop bundles
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}
      - name: Upload Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
      - name: Upload Ubuntu packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  android:
    name: Build Android ARM64
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        shell: bash
        run: sdkmanager "ndk;28.2.13676358"
      - run: npm ci
      - name: Initialize Android project
        shell: bash
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            npm run tauri -- android init --ci
          fi
      - name: Build Android ARM64 debug APK
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
        run: npm run tauri -- android build --ci --debug --apk --target aarch64
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: IEUM-Wallet-v0.0.9.1-android-arm64
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
