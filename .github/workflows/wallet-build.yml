name: Build and release IEUM Wallet Light and Normal

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: 0.0.10.6
        type: string
      core_ref:
        description: ieum-chain tag, branch or commit for Normal
        required: true
        default: v0.21.7
        type: string
      android_release:
        description: Build a signed Android release AAB (requires Android signing secrets)
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  DISPLAY_VERSION: 0.0.10.6

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Validate source versions and signing secret
        shell: bash
        run: |
          test "${{ inputs.version }}" = "$DISPLAY_VERSION"
          npm run validate:release
          test -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
      - run: npm ci
      - run: npm run build
      - run: npm test

  desktop:
    needs: validate
    name: ${{ matrix.label }} / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { edition: light, label: Light, platform: Windows, os: windows-latest, bundles: "nsis,msi", features: "" }
          - { edition: light, label: Light, platform: Ubuntu, os: ubuntu-22.04, bundles: "appimage,deb", features: "" }
          - { edition: normal, label: Normal, platform: Windows, os: windows-latest, bundles: "nsis,msi", features: "--features embedded-core" }
          - { edition: normal, label: Normal, platform: Ubuntu, os: ubuntu-22.04, bundles: "appimage,deb", features: "--features embedded-core" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout IEUM Core
        if: matrix.edition == 'normal'
        uses: actions/checkout@v4
        with:
          repository: c4ei/ieum-chain
          ref: ${{ inputs.core_ref }}
          path: ieum-chain-source
      - name: Install Ubuntu dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 xdg-utils libsqlite3-dev
      - name: Install static SQLite for Windows Normal core
        if: runner.os == 'Windows' && matrix.edition == 'normal'
        shell: pwsh
        run: |
          vcpkg install sqlite3:x64-windows-static-md
          $sqliteLib = "C:\vcpkg\installed\x64-windows-static-md\lib"
          "LIB=$sqliteLib;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RUSTFLAGS=-L native=$sqliteLib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify Windows Normal core source version
        if: runner.os == 'Windows' && matrix.edition == 'normal'
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 --manifest-path ieum-chain-source/Cargo.toml | ConvertFrom-Json).packages[0].version
          if ($version -ne "0.21.7") { throw "Normal core must be IEUM Chain 0.21.7 (actual: $version)" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            ieum-chain-source -> target
      - run: npm ci
      - name: Build and stage IEUM Core
        if: matrix.edition == 'normal'
        shell: bash
        run: |
          cargo build --release --locked --manifest-path ieum-chain-source/Cargo.toml
          node scripts/stage-core-sidecar.mjs
      - run: node scripts/prepare-edition.mjs ${{ matrix.edition }}
      - name: Refresh wallet Rust lockfile
        working-directory: src-tauri
        run: cargo generate-lockfile
      - name: Inject updater verification key
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/configure-updater.mjs
      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: wallet-${{ matrix.edition }}-latest
          releaseName: IEUM Wallet ${{ matrix.label }} v${{ inputs.version }}
          releaseBody: Signed IEUM Wallet ${{ matrix.label }} v${{ inputs.version }} release.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: IEUM-Wallet-${{ matrix.label }}-v${{ inputs.version }}-[platform]-[arch]-[bundle]
          releaseAssetNamePattern: IEUM-Wallet-${{ matrix.label }}-v${{ inputs.version }}-[platform]-[arch]-[bundle][setup].[ext]
          args: --config src-tauri/tauri.${{ matrix.edition }}.conf.json ${{ matrix.features }} --bundles ${{ matrix.bundles }}

  android-light:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;28.2.13676358"
      - run: npm ci
      - run: node scripts/prepare-edition.mjs light
      - name: Recreate Android project for the Light identifier
        shell: bash
        run: |
          rm -rf src-tauri/gen/android
          npm run android:init:light
      - name: Build Light Android APK
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
        run: npm run build:android
      - uses: actions/upload-artifact@v4
        with:
          name: IEUM-Wallet-Light-v${{ inputs.version }}-android-arm64
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  android-release:
    name: Android Light / signed release AAB
    if: ${{ inputs.android_release }}
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;28.2.13676358"
      - run: npm ci
      - run: node scripts/prepare-edition.mjs light
      - name: Recreate Android project for the Light identifier
        run: |
          rm -rf src-tauri/gen/android
          npm run android:init:light
      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ieum-wallet-release.jks"
          {
            printf 'password=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=%s\n' "$RUNNER_TEMP/ieum-wallet-release.jks"
          } > src-tauri/gen/android/keystore.properties
      - name: Build signed Android App Bundle
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run tauri -- android build --ci --aab --target aarch64 --config src-tauri/tauri.light.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: IEUM-Wallet-Light-v${{ inputs.version }}-android-release-aab
          path: src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

  migration-default:
    name: Keep 0.0.9.3 users on Light
    needs: desktop
    runs-on: ubuntu-22.04
    steps:
      - name: Make Light the default GitHub latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit wallet-light-latest --latest
