[package]
name = "ieum-wallet"
version = "0.0.9-1"
description = "IEUM Chain desktop and mobile wallet"
authors = ["IEUM Project"]
edition = "2021"

[lib]
name = "aah_wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ieum-wallet"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"

[dev-dependencies]
tempfile = "3"
